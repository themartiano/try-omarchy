# Architecture-specific companion to the pinned Quattro pacman configuration.
# Arch Linux ARM supplies core/extra/alarm/aur. Omarchy's pkgs.omarchy.org and
# stable-mirror.omarchy.org only publish x86_64 (and multilib), so they stay
# off this guest. omarchy-refresh-pacman copies the ARM templates installed
# into /usr/share/omarchy/default/pacman/.
[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# QEMU direct-boots the immutable kernel and initramfs beside the guest disk.
# Keep the installed modules on that exact ABI until the native launcher can
# atomically promote a matching external kernel and initramfs after updates.
IgnorePkg = linux-aarch64
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
