# Architecture-specific companion to the pinned Quattro pacman configuration.
# Arch Linux ARM supplies core/extra/alarm/aur. Omarchy's channel repositories
# do not publish ARM packages, but its unchannelled aarch64 repository provides
# the architecture-independent keyring package required by the factory build.
[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# QEMU direct-boots the kernel and initramfs paired with this VM disk. Keep its
# installed modules and DKMS headers on that exact ABI. Hyprland is likewise
# held until upstream includes our rounded-border coverage backport; otherwise
# a routine full-system update can silently restore the defect.
IgnorePkg = linux-aarch64 linux-aarch64-headers hyprland
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/$arch
