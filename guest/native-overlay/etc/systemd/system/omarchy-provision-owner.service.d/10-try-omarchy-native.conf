[Service]
# The native VM disk is protected by the macOS account, and SDDM's X11 greeter
# does not render through this VirGL path. Keep the direct Omarchy login that
# provisioning created instead of arming the unencrypted-install cleanup.
ExecStartPost=/usr/bin/rm -f /etc/systemd/system/graphical.target.wants/omarchy-provision-autologin-once.service /etc/systemd/system/omarchy-provision-autologin-once.service
